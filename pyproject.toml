[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promem-mcp"
version = "0.2.0"
description = "Persistent project context runtime for AI coding agents — local-first, MCP-native, token-efficient."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "DIP-RO" },
]
maintainers = [
    { name = "DIP-RO" },
]
keywords = ["mcp", "context", "ai", "coding-agent", "memory", "project-context", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "mcp>=2.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
contextmcp = "contextmcp.cli.main:cli"
promem = "contextmcp.cli.main:cli"

[project.urls]
Homepage = "https://github.com/DIP-RO/MCP_Package"
Repository = "https://github.com/DIP-RO/MCP_Package"
Issues = "https://github.com/DIP-RO/MCP_Package/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/contextmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
